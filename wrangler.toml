name = "fitpilot"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "fitpilot_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Cloudflare Workers AI binding (free tier, used for the AI Coach)
[ai]
binding = "AI"

# Environment variables (set real secrets with `wrangler pages secret put`)
[vars]
AUTH_TRUST_HOST = "true"
